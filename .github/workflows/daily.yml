name: Duvaro 每日任务

on:
  schedule:
    # UTC 时间。早上分析、中午补漏、傍晚补漏、深夜结算
    - cron: "15 6 * * *"
    - cron: "15 11 * * *"
    - cron: "15 16 * * *"
    - cron: "45 22 * * *"
  workflow_dispatch:
    inputs:
      step:
        description: "运行哪一步"
        type: choice
        options: [all, odds, ai, scores]
        default: all
      force_odds:
        description: "强制拉一次赔率（每个联赛消耗 4 次额度）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: duvaro-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 scipy==1.14.1
      - name: 运行
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run.py ${{ inputs.step || 'all' }} ${{ inputs.force_odds && '--force-odds' || '' }}
      - name: 保存数据
        run: |
          git config user.name "duvaro-bot"
          git config user.email "duvaro-bot@users.noreply.github.com"
          git add data/matches.json data/meta.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "数据更新 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
