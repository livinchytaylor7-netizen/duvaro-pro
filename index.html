<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duvaro Pro">
<title>Duvaro Pro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="34" height="34"><span>DUVARO <b>PRO</b></span></div>
  <button id="account" class="pill">登录</button>
</header>
<div class="bar-wrap">
  <nav class="tabs">
    <button data-tab="today" class="on">比赛</button>
    <button data-tab="records">记录</button>
    <button data-tab="stats">统计</button>
  </nav>
  <nav class="leagues" id="leagues"></nav>
</div>
<main id="view"><p class="empty">加载中…</p></main>
<div id="sheet" class="sheet" hidden><div class="sheet-body"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="teams.js"></script>
<script src="app.js"></script>
</body>
</html>
